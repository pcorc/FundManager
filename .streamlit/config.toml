# FundManager web UI: a soft dark theme (keep in step with ui/theme.py).
[theme]
base = "dark"
primaryColor = "#7C9CF5"
backgroundColor = "#1F2430"
secondaryBackgroundColor = "#2C3446"
textColor = "#E3E7EF"
linkColor = "#A9BDF8"
borderColor = "#363F52"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.55rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
codeBackgroundColor = "#232938"
greenColor = "#7FCB9B"
redColor = "#EE8E8E"
orangeColor = "#E6C07B"
yellowColor = "#E6C07B"
blueColor = "#7C9CF5"
grayColor = "#A3ACBD"

[client]
toolbarMode = "minimal"
